apiVersion: apps/v1
kind: Deployment
metadata:
  name: archiver
  namespace: log-pipeline
spec:
  replicas: 1
  selector:
    matchLabels:
      app: archiver
  template:
    metadata:
      labels:
        app: archiver
    spec:
      containers:
      - name: archiver
        image: log-archiver:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: KAFKA_BOOTSTRAP
          value: "kafka:9092"
        - name: INPUT_TOPIC
          value: "raw-logs"
        - name: GROUP_ID
          value: "archiver-group"
        - name: INTERVAL_MINUTES
          value: "5"
        - name: MINIO_ENDPOINT
          value: "minio:9000"
        - name: MINIO_ACCESS_KEY
          value: "minioadmin"
        - name: MINIO_SECRET_KEY
          value: "minioadmin"
        - name: MINIO_BUCKET
          value: "logs-archive"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
