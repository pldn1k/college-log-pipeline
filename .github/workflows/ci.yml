name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
    
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  
jobs:
  # =====================
  # 1. Линтинг и проверка
  # =====================
  lint:
    name: Линтинг и проверка кода
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Установка зависимостей для линтинга
        run: |
          pip install flake8 pylint
          pip install -r app/collector/requirements.txt
          pip install -r app/parser/requirements.txt
          pip install -r app/archiver/requirements.txt
          
      - name: Flake8 (проверка стиля)
        run: |
          sudo apt-get install -y yamlint
          yamlint k8s/**/*.yaml
          
  # =====================
  # Сборка Docker образов
  # =====================
  build:
    name: Сборка Docker образов
    runs-on: ubuntu-latest
    needs: lint
    
    strategy:
      matrix:
        service: [collector, parser, archiver]
        
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: app/${{ matrix.service }}/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.service }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.servuce }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha, mode=max
          
  # ====================
  # Деплой (опционально)
  # ====================
  deploy:
    name: Деплой в Kind
    runs-on: ubuntu-latest
    needs: build
    if: githun.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Install Kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.20.0/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind
          
      - name: Install kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/
          
      - name: Создание Kind кластера
        run: |
          kind create-cluster --config kind-config.yaml --name log-pipeline
          
      - name: Загрузка образов из реестра
        run: |
          kind load docker-image ${{ env.REGISTRY }}/${{ env.IMAGE_NAME}}/collector:${{ github.sha }} --name log-pipeline
          kind load docker-image ${{ env.REGISTRY }}/%{{ env.IMAGE_NAME}}/parser:${{ github.sha }} --name log-pipeline
          kind load docker-image ${{ env.REGISRTY }}/%{{ env.IMAGE_NAME}}/archiver:${{ github.sha }} --name log-pipeline
          
      - name: Деплой приложений
        run: |
          make deploy-all
          kubectl wait --for=condition=ready pod -l app=collector log-pipeline --timeout=60s
          kubectl wait --for=condition=ready pod -l app=parser log-pipeline --timeout=60s
          kubectl wait --for=condition=ready pod -l app=archiver log-pipeline --timeout=60s
          
      - name: Статус подов
        run: |
          kubectl get pods -n log-pipeline
